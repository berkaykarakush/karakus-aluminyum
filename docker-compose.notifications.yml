services:
  web:
    environment:
      Notifications__Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      Notifications__Smtp__Port: ${SMTP_PORT:-587}
      Notifications__Smtp__Username: ${SMTP_USERNAME}
      Notifications__Smtp__Password: ${SMTP_PASSWORD}
      Notifications__Smtp__From: ${SMTP_FROM}
      Notifications__Smtp__FromName: ${SMTP_FROM_NAME:-Karakuş Alüminyum}
      Notifications__Smtp__Security: ${SMTP_SECURITY:-auto}
      Notifications__Smtp__To: ${NOTIFICATION_EMAIL_TO}
      Notifications__WhatsApp__AccessToken: ${WHATSAPP_ACCESS_TOKEN}
      Notifications__WhatsApp__PhoneNumberId: ${WHATSAPP_PHONE_NUMBER_ID}
      Notifications__WhatsApp__To: ${WHATSAPP_TO}
      Notifications__WhatsApp__GraphApiVersion: ${WHATSAPP_GRAPH_API_VERSION:-v22.0}
